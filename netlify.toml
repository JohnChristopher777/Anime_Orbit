[build]
  command = "npm run build"
  publish = "build" 
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/api/anime-digest"
  to = "/.netlify/functions/anime-digest"
  status = 200

[[redirects]]
  from = "/api/discovery"
  to = "/.netlify/functions/discovery"
  status = 200

[[redirects]]
  from = "/api/anime-quotes"
  to = "/.netlify/functions/anime-quotes"
  status = 200

[[redirects]]
  from = "/api/characters"
  to = "/.netlify/functions/characters"
  status = 200

[[redirects]]
  from = "/api/manga-metadata"
  to = "/.netlify/functions/manga-metadata"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
