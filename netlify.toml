[build]
  publish = "netlify-redirect"

# Permanent, path-preserving site move. /anime/35760, /character/46488, query
# strings, and every other indexed URL land on their Firebase equivalent. The
# one published verification file is intentionally allowed to shadow this rule.
[[redirects]]
  from = "/*"
  to = "https://animehelix.web.app/:splat"
  status = 301
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
