<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/animeorbit.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121216" />

    <!-- Primary Meta Tags for Search Engines & SEO -->
    <title>Anime Orbit - Your Ultimate Anime Compass & Universal Guide</title>
    <meta
      name="title"
      content="Anime Orbit - Your Ultimate Anime Compass & Universal Guide"
    />
    <meta
      name="description"
      content="Lost in the vast anime universe? Anime Orbit is your cosmic compass guiding you through all genres: Action, Fantasy, Sci-Fi, Romance, Drama, and legendary sagas like One Piece, Bleach, Naruto, Vinland Saga, Jujutsu Kaisen, and Attack on Titan. Explore episode guides, character archives, user reviews, and personalized watchlists."
    />
    <meta
      name="keywords"
      content="Anime Orbit, anime database, all genre anime, anime compass, One Piece, Naruto Shippuden, Bleach Thousand-Year Blood War, Vinland Saga, Jujutsu Kaisen, Attack on Titan, Solo Leveling, Demon Slayer, Frieren, anime episode guide, anime characters, anime reviews, anime watchlist"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Anime Orbit Universe" />
    <link rel="canonical" href="https://animeorbit.web.app/" />

    <!-- Open Graph / Facebook / Discord SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://animeorbit.web.app/" />
    <meta
      property="og:title"
      content="Anime Orbit - Your Ultimate Anime Compass & Universal Guide"
    />
    <meta
      property="og:description"
      content="Navigate legendary anime worlds across all genres. Detailed episode databases, character artwork, tier rankings, and personalized community tracking for One Piece, Bleach, Naruto, Vinland Saga, and all top anime."
    />
    <meta property="og:image" content="/animeorbit.jpg" />
    <meta property="og:image:alt" content="Anime Orbit - Anime Compass Logo" />
    <meta property="og:site_name" content="Anime Orbit" />

    <!-- Twitter Card SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://animeorbit.web.app/" />
    <meta
      name="twitter:title"
      content="Anime Orbit - Your Ultimate Anime Compass & Universal Guide"
    />
    <meta
      name="twitter:description"
      content="Your compass in the anime universe. Explore episode lists, character galleries, community reviews, and tier lists for all anime genres."
    />
    <meta name="twitter:image" content="/animeorbit.jpg" />

    <!-- Mobile & PWA Optimization -->
    <meta name="application-name" content="Anime Orbit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Anime Orbit" />
    <link rel="apple-touch-icon" href="/animeorbit.jpg" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Staatliches&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) for Google Search Compass Indexing -->
    <script id="schema-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Anime Orbit",
        "alternateName": "Anime Orbit - Universal Anime Compass",
        "url": "https://animeorbit.web.app/",
        "description": "Your compass in the anime galaxy featuring comprehensive episode guides, character archives, and reviews across all genres including One Piece, Bleach, Naruto, Vinland Saga, and top anime series.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://animeorbit.web.app/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to experience Anime Orbit.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
