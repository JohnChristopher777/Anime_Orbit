<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Primary Meta Tags for Search Engines & SEO -->
    <title>Anime Orbit | Anime &amp; Manga Discovery, Guides &amp; Tracking</title>
    <meta
      name="title"
      content="Anime Orbit | Anime &amp; Manga Discovery, Guides &amp; Tracking"
    />
    <meta
      name="description"
      content="Anime Orbit helps you discover anime and manga, browse episode and chapter guides, track watchlists, build tier lists, and join community discussions."
    />
    <meta
      name="keywords"
      content="Anime Orbit, anime database, all genre anime, anime compass, One Piece, Naruto Shippuden, Bleach Thousand-Year Blood War, Vinland Saga, Jujutsu Kaisen, Attack on Titan, Solo Leveling, Demon Slayer, Frieren, anime episode guide, anime characters, anime reviews, anime watchlist"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Anime Orbit" />
    <link rel="canonical" href="https://animeorbit.web.app/" />

    <!-- Open Graph / Facebook / Discord SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://animeorbit.web.app/" />
    <meta
      property="og:title"
      content="Anime Orbit | Anime &amp; Manga Discovery, Guides &amp; Tracking"
    />
    <meta
      property="og:description"
      content="Discover anime and manga, browse episode and chapter guides, track watchlists, build tier lists, and join community discussions."
    />
    <meta property="og:image" content="https://animeorbit.web.app/animeorbit.jpg" />
    <meta property="og:image:alt" content="Anime Orbit - Anime Compass Logo" />
    <meta property="og:site_name" content="Anime Orbit" />

    <!-- Twitter Card SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://animeorbit.web.app/" />
    <meta
      name="twitter:title"
      content="Anime Orbit | Anime &amp; Manga Discovery, Guides &amp; Tracking"
    />
    <meta
      name="twitter:description"
      content="Discover anime and manga, browse guides, track watchlists, build tier lists, and join the Anime Orbit community."
    />
    <meta name="twitter:image" content="https://animeorbit.web.app/animeorbit.jpg" />

    <!-- Mobile & PWA Optimization -->
    <meta name="application-name" content="Anime Orbit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Anime Orbit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="msapplication-TileColor" content="#000000" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-icon-192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://s4.anilist.co" crossorigin />
    <link rel="dns-prefetch" href="https://graphql.anilist.co" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Staatliches&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Root-level identity data used by search engines for the site name. -->
    <script id="schema-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://animeorbit.web.app/#website",
            "url": "https://animeorbit.web.app/",
            "name": "Anime Orbit",
            "alternateName": ["AnimeOrbit", "animeorbit.web.app"],
            "description": "Anime and manga discovery, episode and chapter guides, watchlists, tier lists, and community discussions.",
            "inLanguage": "en",
            "publisher": { "@id": "https://animeorbit.web.app/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://animeorbit.web.app/#organization",
            "name": "Anime Orbit",
            "url": "https://animeorbit.web.app/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://animeorbit.web.app/icon.png"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to experience Anime Orbit.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
