<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/animeorbit.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- Primary Meta Tags for SEO -->
    <meta name="title" content="Anime Orbit - Your Ultimate Anime Database" />
    <meta
      name="description"
      content="Explore Anime Orbit, the ultimate anime database featuring detailed anime lists, episode counts, character info, and more. Discover popular, airing, and upcoming anime titles."
    />
    <meta
      name="keywords"
      content="anime database, anime orbit, anime details, anime list, anime episode count, popular anime, upcoming anime, airing anime"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Anime Orbit Team" />

    <!-- Open Graph Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shonenanimeorbit.netlify.app/" />
    <meta
      property="og:title"
      content="Anime Orbit - Your Ultimate Anime Database"
    />
    <meta
      property="og:description"
      content="Discover Anime Orbit: detailed anime lists, episode counts, characters, and more for popular, airing, and upcoming anime. Your go-to anime resource!"
    />
    <meta property="og:image" content="/animeorbit.jpg" />
    <meta property="og:image:alt" content="Anime Orbit Logo" />
    <meta property="og:site_name" content="Anime Orbit" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://shonenanimeorbit.netlify.app/" />
    <meta
      name="twitter:title"
      content="Anime Orbit - Your Ultimate Anime Database"
    />
    <meta
      name="twitter:description"
      content="Anime Orbit offers detailed anime lists, episode counts, and more for anime fans. Explore popular, airing, and upcoming titles now!"
    />
    <meta name="twitter:image" content="/animeorbit.jpg" />

    <!-- Additional SEO Enhancements -->
    <meta name="application-name" content="Anime Orbit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Anime Orbit" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Staatliches&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Anime Orbit</title>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
